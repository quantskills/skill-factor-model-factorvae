<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" role="img" aria-labelledby="title desc">
  <title id="title">FactorVAE 因子合成网络结构</title>
  <desc id="desc">历史因子序列编码为股票嵌入。训练期使用标签构建后验潜在因子，推理期使用历史特征构建先验因子，随后由 alpha-beta 解码器生成横截面信号。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#44546a"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f9f"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c86b20"/></marker>
    <style>
      .title { font: 700 27px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #16243a; }
      .subtitle { font: 400 15px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #536579; }
      .label { font: 700 17px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #1e3148; text-anchor: middle; }
      .small { font: 400 14px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #41546a; text-anchor: middle; }
      .tiny { font: 400 12px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #536579; text-anchor: middle; }
      .section { font: 700 14px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #ffffff; }
      .box { stroke-width: 2; rx: 12; ry: 12; }
      .arrow { stroke: #44546a; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .bluearrow { stroke: #2f6f9f; stroke-width: 2.5; fill: none; marker-end: url(#arrowBlue); }
      .orangearrow { stroke: #c86b20; stroke-width: 2.5; fill: none; marker-end: url(#arrowOrange); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1500" height="790" fill="#f8fafc"/>
  <text x="58" y="58" class="title">FactorVAE：概率动态因子模型</text>
  <text x="58" y="84" class="subtitle">独立多因子面板合成 · 后验因子指导训练 · 先验因子用于推理</text>

  <rect x="48" y="126" width="1404" height="344" rx="16" fill="#f1f6fb" stroke="#b8cce0" stroke-width="1.5"/>
  <rect x="48" y="126" width="196" height="36" rx="16" fill="#2f6f9f"/>
  <text x="70" y="150" class="section">共享特征路径</text>

  <rect x="82" y="252" width="185" height="104" class="box" fill="#e8f2fb" stroke="#75a9d2"/>
  <text x="174" y="286" class="label">历史因子</text>
  <text x="174" y="309" class="label">序列 X</text>
  <text x="174" y="334" class="small">股票 × 回看期 × 因子</text>

  <rect x="343" y="252" width="190" height="104" class="box" fill="#dcedfa" stroke="#5492c2"/>
  <text x="438" y="287" class="label">GRU 特征编码器</text>
  <text x="438" y="315" class="small">时序股票表示</text>

  <rect x="610" y="252" width="185" height="104" class="box" fill="#e8f2fb" stroke="#75a9d2"/>
  <text x="702" y="290" class="label">股票嵌入 e</text>
  <text x="702" y="318" class="small">每只股票一个嵌入</text>

  <path d="M267 304 H343" class="bluearrow"/>
  <path d="M533 304 H610" class="bluearrow"/>

  <rect x="863" y="204" width="230" height="118" class="box" fill="#eeeafa" stroke="#9178c6"/>
  <text x="978" y="240" class="label">多头全局注意力</text>
  <text x="978" y="267" class="small">市场级聚合</text>
  <text x="978" y="291" class="tiny">对 e 的可学习查询</text>
  <path d="M795 286 C825 270 830 263 863 263" class="bluearrow"/>

  <rect x="1153" y="204" width="225" height="118" class="box" fill="#eeeafa" stroke="#9178c6"/>
  <text x="1265" y="240" class="label">先验因子分布</text>
  <text x="1265" y="268" class="small">p(z | X) = N(μprior, σprior)</text>
  <text x="1265" y="291" class="tiny">推理阶段可用</text>
  <path d="M1093 263 H1153" class="arrow"/>

  <rect x="928" y="364" width="225" height="78" class="box" fill="#e4f4ea" stroke="#5aa275"/>
  <text x="1041" y="395" class="label">Alpha-Beta 解码器</text>
  <text x="1041" y="419" class="small">ŷ = α(e) + β(e) z</text>
  <path d="M1265 322 C1240 348 1197 385 1153 398" class="arrow"/>
  <path d="M795 324 C845 351 874 387 928 399" class="bluearrow"/>

  <rect x="1220" y="364" width="185" height="78" class="box" fill="#e4f4ea" stroke="#5aa275"/>
  <text x="1312" y="395" class="label">横截面信号</text>
  <text x="1312" y="419" class="small">日期、标的、信号</text>
  <path d="M1153 403 H1220" class="arrow"/>

  <rect x="48" y="514" width="1404" height="220" rx="16" fill="#fff8ed" stroke="#e6bf83" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="48" y="514" width="196" height="36" rx="16" fill="#c86b20"/>
  <text x="70" y="538" class="section">仅训练期后验路径</text>

  <rect x="136" y="594" width="192" height="92" class="box" fill="#fff0dd" stroke="#d58a40"/>
  <text x="232" y="627" class="label">未来标签 y</text>
  <text x="232" y="653" class="small">横截面收益目标</text>

  <rect x="411" y="584" width="234" height="112" class="box" fill="#fff0dd" stroke="#d58a40"/>
  <text x="528" y="617" class="label">动态组合层</text>
  <text x="528" y="644" class="small">基于 e 加权的组合收益</text>
  <text x="528" y="668" class="tiny">压缩可变股票截面</text>
  <path d="M328 640 H411" class="orangearrow"/>
  <path d="M702 356 C684 459 642 569 615 584" class="bluearrow dashed"/>

  <rect x="730" y="584" width="235" height="112" class="box" fill="#f5eafa" stroke="#a585c6"/>
  <text x="847" y="618" class="label">后验因子分布</text>
  <text x="847" y="645" class="small">q(z | X, y) = N(μpost, σpost)</text>
  <text x="847" y="668" class="tiny">标签引导的潜在因子</text>
  <path d="M645 640 H730" class="orangearrow"/>

  <rect x="1056" y="585" width="230" height="110" class="box" fill="#f5eafa" stroke="#a585c6"/>
  <text x="1171" y="618" class="label">重构损失 + KL 目标</text>
  <text x="1171" y="645" class="small">用 zpost 重构 y</text>
  <text x="1171" y="668" class="tiny">使 q(z | X, y) 与 p(z | X) 对齐</text>
  <path d="M965 640 H1056" class="orangearrow"/>
  <path d="M1265 322 C1246 436 1222 523 1190 585" class="arrow dashed"/>
  <path d="M1041 442 C1060 494 1102 548 1131 585" class="arrow dashed"/>

  <rect x="64" y="757" width="16" height="16" rx="3" fill="#e8f2fb" stroke="#75a9d2"/><text x="90" y="770" class="tiny" text-anchor="start">历史特征</text>
  <rect x="262" y="757" width="16" height="16" rx="3" fill="#eeeafa" stroke="#9178c6"/><text x="288" y="770" class="tiny" text-anchor="start">潜在因子分布</text>
  <rect x="510" y="757" width="16" height="16" rx="3" fill="#fff0dd" stroke="#d58a40"/><text x="536" y="770" class="tiny" text-anchor="start">仅训练期标签路径</text>
  <rect x="754" y="757" width="16" height="16" rx="3" fill="#e4f4ea" stroke="#5aa275"/><text x="780" y="770" class="tiny" text-anchor="start">推理输出</text>
</svg>
